<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<title>Cyber 30 Jours</title>
<meta name="theme-color" content="#050507">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyber30J">
<meta name="description" content="Widget de suivi du parcours cybersécurité 30 jours : jour du jour, progression, théorie, commandes, défis et notes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#050507; --card:#0d0d13; --line:#1e1e28; --line2:#26262f;
  --txt:#f4f4f5; --mut:#9ca3af; --dim:#6b7280;
  --em:#10b981; --em2:#34d399; --cyan:#06b6d4; --violet:#8b5cf6; --amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.45;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(600px 340px at 15% -5%, rgba(16,185,129,.14), transparent 65%),
    radial-gradient(520px 320px at 90% 0%, rgba(6,182,212,.08), transparent 60%);
}
header{
  position:sticky; top:0; z-index:10; padding:14px 16px 0;
  background:rgba(5,5,7,.88); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;justify-content:space-between;align-items:center;font-size:16px;letter-spacing:.01em}
.brand .l{display:flex;align-items:center;gap:8px;font-weight:700}
.brand .l svg{flex-shrink:0;filter:drop-shadow(0 0 6px rgba(16,185,129,.55))}
.brand .r{font-size:12px;color:var(--em2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:7px;background:#14141b;border-radius:99px;margin:10px 0 12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar.sm{height:4px;margin:7px 0}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--em),var(--cyan));box-shadow:0 0 10px rgba(16,185,129,.5);transition:width .4s ease}
nav{display:flex;gap:7px;padding-bottom:12px}
nav button{
  flex:1;background:#0f0f16;border:1px solid var(--line2);color:var(--mut);
  padding:9px 0;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .15s;
}
nav button.on{
  background:rgba(16,185,129,.13);border-color:rgba(16,185,129,.45);color:var(--em2);
  box-shadow:0 0 14px rgba(16,185,129,.15) inset;
}
main{position:relative;z-index:1;padding:16px 14px 34px;max-width:640px;margin:0 auto}
.card{
  background:linear-gradient(180deg,#0e0e15,#0b0b10);
  border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:14px;
  box-shadow:0 8px 28px rgba(0,0,0,.45);
}
.card.cur{border-color:rgba(16,185,129,.4);box-shadow:0 8px 28px rgba(0,0,0,.45),0 0 22px rgba(16,185,129,.08)}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:8px}
.badge{font-size:11px;font-weight:800;padding:4px 11px;border-radius:99px;letter-spacing:.03em;white-space:nowrap}
.ok{color:var(--em2);font-weight:800;font-size:13px}
h2{font-size:19px;line-height:1.3;margin-bottom:7px;letter-spacing:-.01em}
h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin-bottom:9px;font-weight:700}
.obj{color:#d4d4d8;font-size:14px;margin-bottom:13px}
.done-btn{
  width:100%;padding:12px;border-radius:13px;cursor:pointer;font-weight:800;font-size:14px;
  border:1px solid rgba(16,185,129,.4);background:rgba(16,185,129,.09);color:var(--em2);
  transition:all .15s;
}
.done-btn.on{background:linear-gradient(90deg,var(--em),#059669);color:#03130d;border-color:transparent;box-shadow:0 4px 18px rgba(16,185,129,.3)}
.done-btn:active{transform:scale(.985)}
.sec{border-top:1px solid var(--line);padding:13px 0 3px;margin-top:11px}
.sec ul{margin:8px 0 2px 18px;color:#d4d4d8;font-size:13.5px}
.sec li{margin-bottom:4px}
.sec p{color:#d4d4d8;font-size:13.5px}
.link{color:var(--em2);font-weight:700;font-size:13.5px;text-decoration:none;display:inline-block;margin-bottom:5px}
.link:active{opacity:.7}
.code{position:relative;background:#07070b;border:1px solid var(--line);border-radius:11px;margin:9px 0;overflow:hidden}
.code pre{
  padding:13px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;color:#a7f3d0;white-space:pre-wrap;word-break:break-word;line-height:1.55;
  max-height:340px;overflow:auto;
}
.copy{
  position:sticky;float:right;top:6px;margin:6px 6px 0 0;background:#181822;color:var(--mut);
  border:1px solid var(--line2);border-radius:8px;font-size:11px;padding:4px 10px;cursor:pointer;font-weight:600;
}
.copy.ok{color:var(--em2);border-color:rgba(16,185,129,.4)}
.exo{margin-top:9px}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.hint{background:#14141c;border:1px solid var(--line2);color:#a1a1aa;font-size:11px;padding:4px 10px;border-radius:99px}
textarea{
  width:100%;min-height:84px;background:#07070b;border:1px solid var(--line);border-radius:11px;
  color:#e4e4e7;padding:11px;font-size:13.5px;font-family:inherit;resize:vertical;
}
textarea:focus,input:focus{outline:1px solid rgba(16,185,129,.5)}
.navrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.navrow span{font-weight:800;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.navrow button{
  background:#0f0f16;border:1px solid var(--line2);color:var(--txt);
  width:46px;height:40px;border-radius:12px;font-size:15px;cursor:pointer;transition:all .15s;
}
.navrow button:active{background:#181820}
.foot{color:var(--dim);font-size:12px;display:flex;flex-direction:column;gap:11px;padding:6px 2px 0;margin-top:14px;border-top:1px solid var(--line)}
.foot label{color:var(--mut);display:flex;flex-direction:column;gap:5px;font-weight:600}
.foot .inline{flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}
.foot input[type=date],.foot input[type=time]{
  background:#0d0d13;border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:8px 10px;font-size:14px;
}
.btnrow{display:flex;flex-wrap:wrap;gap:7px}
.mini{
  background:#101019;border:1px solid var(--line2);color:#c7c9cf;border-radius:10px;
  padding:8px 13px;font-size:12px;cursor:pointer;font-weight:600;transition:all .15s;
}
.mini:active{background:#181822}
.mini.acc{border-color:rgba(16,185,129,.4);color:var(--em2)}
.mini.on{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.5);color:var(--em2)}
.mini.danger{border-color:rgba(220,38,38,.4);color:#f87171}
.mut{color:var(--mut);font-size:12.5px}
.wk{margin-bottom:16px}
.wkhead{font-weight:800;font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wkhead .rng{color:var(--dim);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.row{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;
  color:var(--txt);padding:8px 0;font-size:13.5px;border-bottom:1px solid #14141b;cursor:pointer;
}
.row:last-child{border-bottom:none}
.row .num{
  width:27px;height:27px;border:1.5px solid;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;color:inherit;font-variant-numeric:tabular-nums;
}
.row.did .rt{color:var(--dim);text-decoration:line-through}
.row .rt{flex:1}
.wkcard .bar{margin:10px 0 8px}
</style>
</head>

<script>
"use strict";
const DATA=[{"id": 1, "week": 1, "title": "Jour 1 \u2014 Le Shell et la navigation", "objective": "\u00catre capable de naviguer dans Linux uniquement avec le terminal.", "theory": {"label": "Linux Journey - The Shell + pwd, ls, cd", "url": "https://labex.io/linuxjourney", "details": ["Module 'The Shell' : comprendre ce qu'est un shell, prompt, chemin absolu vs relatif", "Commandes pwd (o\u00f9 suis-je), ls -la (lister tout y compris cach\u00e9), cd (changer de dossier)", "Lire man ls pour comprendre les options"]}, "practice": {"intro": "Prends un terminal Ubuntu (VM ou WSL).", "commands": ["pwd", "ls -la", "cd ~", "cd /etc", "pwd", "cd -", "man ls", "history | tail -20"], "exercice": "Cr\u00e9e ton lab: mkdir -p ~/cyber-lab/{notes,outils,exercices} && cd ~/cyber-lab && pwd && ls -R"}, "defi": "Affiche le contenu de /etc/passwd sans interface graphique, puis reviens dans ~/cyber-lab uniquement avec cd.", "notesPrompt": ["Diff\u00e9rence chemin absolu / relatif ?", "Que fait ls -a ?", "Raccourci cd - et cd ~ ?"], "validation": "Tu sais o\u00f9 tu es et lister n'importe quel dossier en CLI."}, {"id": 2, "week": 1, "title": "Jour 2 \u2014 Cr\u00e9er, d\u00e9placer, supprimer", "objective": "Ma\u00eetriser la manipulation de fichiers/dossiers en ligne de commande.", "theory": {"label": "Linux Journey - touch, file, mkdir, cp, mv, rm, history", "url": "https://labex.io/linuxjourney", "details": ["touch cr\u00e9e un fichier vide, file identifie un type", "cp, mv, rm avec -r et -i pour s\u00e9curit\u00e9", "history + !n pour rejouer une commande"]}, "practice": {"intro": "Dans cyber-lab, manipule des fichiers comme en investigation.", "commands": ["touch notes/jour-1.txt notes/jour-2.txt", "echo \"jour 1\" > notes/jour-1.txt", "mkdir -p exercices/jour2", "cp notes/jour-1.txt exercices/jour2/", "mv exercices/jour2/jour-1.txt exercices/jour2/backup.txt", "rm -i exercices/jour2/backup.txt", "file notes/*", "history > notes/historique.txt"], "exercice": "Arborescence: cyber-lab/notes/jour-{1,2}.txt, cyber-lab/outils/, cyber-lab/exercices/. Utilise file et cat pour v\u00e9rifier."}, "defi": "Cr\u00e9e 5 fichiers, renomme-en 2, copie-en 1 dans un autre dossier, supprime-en 1 avec confirmation. Le tout en <10 commandes.", "notesPrompt": ["Danger de rm -rf ?", "Diff\u00e9rence cp et mv ?", "\u00c0 quoi sert file ?"], "validation": "Tu manipules fichiers sans GUI."}, {"id": 3, "week": 1, "title": "Jour 3 \u2014 Lire et comprendre des fichiers", "objective": "Lire rapidement n'importe quel fichier texte et en extraire l'essentiel.", "theory": {"label": "Linux Journey - Text-Fu: cat, less, head, tail", "url": "https://labex.io/linuxjourney", "details": ["cat pour petit fichier, less pour naviguer (q pour quitter)", "head -n 20, tail -n 20, tail -f pour logs", "less + /mot pour chercher"]}, "practice": {"intro": "Analyse de logs simul\u00e9s.", "commands": ["cat /etc/hosts", "head -n 20 /etc/passwd", "tail -n 20 /var/log/syslog 2>/dev/null || tail -n 20 /var/log/messages 2>/dev/null", "echo -e \"admin:123\\nuser:password\\nroot:toor\" > test.txt", "cat test.txt", "less test.txt"], "exercice": "Cr\u00e9e un fichier avec 100 lignes: seq 1 100 > big.txt puis affiche seulement lignes 40-60 avec head/tail combin\u00e9s."}, "defi": "Sans ouvrir d'\u00e9diteur graphique, affiche les 5 premi\u00e8res et 5 derni\u00e8res lignes de /etc/passwd.", "notesPrompt": ["Quand utiliser cat vs less ?", "Que fait tail -f ?", "Comment quitter less ?"], "validation": "Tu sais lire efficacement."}, {"id": 4, "week": 1, "title": "Jour 4 \u2014 Rechercher et filtrer", "objective": "Trouver une information cach\u00e9e parmi des milliers de fichiers.", "theory": {"label": "Linux Journey - Text-Fu suite: grep, find, wc, sort, uniq", "url": "https://labex.io/linuxjourney", "details": ["grep -i -r pour recherche insensible \u00e0 la casse r\u00e9cursive", "find . -name \"*.txt\" -type f", "wc -l, sort, uniq pour d\u00e9dupliquer"]}, "practice": {"intro": "Recherche d'indices comme en forensique.", "commands": ["grep -i \"password\" test.txt", "grep -R \"root\" ~/cyber-lab 2>/dev/null", "find ~/cyber-lab -name \"*.txt\"", "find /etc -type f -name \"*.conf\" 2>/dev/null | head", "wc -l /etc/passwd", "cat /etc/passwd | cut -d: -f1 | sort | uniq"], "exercice": "Dans ~/cyber-lab, cherche tous les .txt contenant 'jour': grep -R \"jour\" --include=\"*.txt\" ."}, "defi": "Trouve combien d'utilisateurs ont un shell /bin/bash dans /etc/passwd avec grep + wc -l.", "notesPrompt": ["Diff\u00e9rence grep et find ?", "Que fait 2>/dev/null ?", "Comment combiner grep et find ?"], "validation": "Tu sais fouiller un syst\u00e8me."}, {"id": 5, "week": 1, "title": "Jour 5 \u2014 Permissions et utilisateurs", "objective": "Comprendre et expliquer rwx, chmod 600/644/755 et le principe du moindre privil\u00e8ge.", "theory": {"label": "Linux Journey - Permissions + User Management", "url": "https://labex.io/linuxjourney", "details": ["ls -l : -rwxr-xr-- => user/group/other", "whoami, id, groups", "chmod 600 (rw-------) secret, 644 fichier public, 755 script/dossier", "chown user:group"]}, "practice": {"intro": "S\u00e9curise des fichiers sensibles.", "commands": ["whoami", "id", "ls -l ~/cyber-lab/notes/", "touch secret.txt && echo \"mdp=1234\" > secret.txt", "chmod 600 secret.txt", "ls -l secret.txt", "chmod 644 secret.txt", "chmod 755 ~/cyber-lab", "ls -ld ~/cyber-lab"], "exercice": "Cr\u00e9e un script: echo 'echo hacked' > test.sh; chmod 755 test.sh; ./test.sh puis passe-le en 644 et observe l'erreur."}, "defi": "Explique \u00e0 voix haute ce que fait chmod 600 et pourquoi c'est crucial pour une cl\u00e9 SSH priv\u00e9e.", "notesPrompt": ["Que signifie rwx ?", "600 vs 644 vs 755 ?", "Moindre privil\u00e8ge = ?"], "validation": "Tu sais lire et corriger des permissions."}, {"id": 6, "week": 1, "title": "Jour 6 \u2014 Processus, sudo et root", "objective": "G\u00e9rer les processus et comprendre les risques du compte root.", "theory": {"label": "Linux Journey - Processes + sudo", "url": "https://labex.io/linuxjourney", "details": ["ps aux, top / htop", "kill, kill -9 (dernier recours)", "sudo : ex\u00e9cuter en root temporaire, sudo -l pour voir tes droits", "Principe moindre privil\u00e8ge : jamais travailler en root permanent"]}, "practice": {"intro": "Surveillance syst\u00e8me comme un SOC.", "commands": ["ps aux | head -20", "ps aux | grep bash", "top -b -n1 | head -20", "sleep 100 &", "ps aux | grep sleep", "kill %1", "sudo ls -l /root 2>&1", "sudo -l"], "exercice": "Lance 2 sleep en arri\u00e8re-plan, liste-les, tue-les proprement, v\u00e9rifie qu'ils sont partis."}, "defi": "Trouve le PID du processus le plus gourmand avec top, puis explique pourquoi kill -9 peut corrompre des donn\u00e9es.", "notesPrompt": ["Diff\u00e9rence ps et top ?", "Pourquoi \u00e9viter root permanent ?", "kill vs kill -9 ?"], "validation": "Tu sais surveiller et stopper un processus."}, {"id": 7, "week": 1, "title": "Jour 7 \u2014 OverTheWire Bandit (niveaux 0-7)", "objective": "R\u00e9soudre des probl\u00e8mes Linux r\u00e9els en mode CTF d\u00e9butant.", "theory": {"label": "OverTheWire Bandit - Wargame", "url": "https://overthewire.org/wargames/bandit/", "details": ["Connexion: ssh bandit0@bandit.labs.overthewire.org -p 2220 mdp:bandit0", "Niveau 0: ls, cat readme", "Niveau 1-2: cat fichier avec tiret => cat ./- , fichiers avec espaces", "Niveau 3-7: ls -a (cach\u00e9), file, find, grep, sort, uniq, strings"]}, "practice": {"intro": "Joue les niveaux 0 \u00e0 7. Ne copie pas, comprends.", "commands": ["ssh bandit0@bandit.labs.overthewire.org -p 2220", "ls -la", "cat ./-", "cat \"spaces in this filename\"", "find . -type f -size 33c", "grep -r \"password\" . 2>/dev/null"], "exercice": "Pour chaque niveau, remplis ton template dans ~/cyber-lab/notes/bandit.md"}, "defi": "Termine Bandit 0-7 sans aide externe et r\u00e9dige ton template pour au moins 3 niveaux.", "notesPrompt": ["Template: Probl\u00e8me / Commande / Pourquoi \u00e7a marche / Ce que j'ai appris", "Quelle commande t'a le plus surpris ?", "Comment g\u00e9rer un fichier nomm\u00e9 '-' ?"], "validation": "Tu as r\u00e9solu 7 mini-\u00e9nigmes Linux en autonomie."}, {"id": 8, "week": 2, "title": "Jour 8 \u2014 Mod\u00e8le OSI et TCP/IP", "objective": "Expliquer \u00e0 quoi servent les 7 couches OSI et les 4 couches TCP/IP.", "theory": {"label": "Professor Messer - Network+ N10-008 - OSI Model", "url": "https://www.youtube.com/playlist?list=PLG49S3nxzAnnVhoAaL4B6aMFDQ8_gdxAy", "details": ["OSI 7 couches: Physique, Liaison, R\u00e9seau, Transport, Session, Pr\u00e9sentation, Application", "TCP/IP 4 couches: Acc\u00e8s r\u00e9seau, Internet, Transport, Application", "Mn\u00e9monique: 'Tous Les R\u00e9seaux Tr\u00e8s S\u00fbrs Parfois Apparaissent' (de bas en haut)", "Vid\u00e9o Messer: 'OSI Model' et 'TCP/IP Model' dans la playlist"]}, "practice": {"intro": "Cartographie mentale.", "commands": ["# Pas de commande, dessine le mod\u00e8le sur papier", "echo \"7:Application - HTTP,DNS\" > ~/cyber-lab/notes/osi.txt"], "exercice": "Tableau: | Couche | Exemple | Ton explication | puis: | 7 Application | HTTP, DNS, SSH | ... | 4 Transport | TCP, UDP | ... | 3 Internet | IP, ICMP | ... | 2 Acc\u00e8s | Ethernet, WiFi |"}, "defi": "Explique \u00e0 un ami en 2 minutes pourquoi on a besoin de couches.", "notesPrompt": ["OSI vs TCP/IP diff\u00e9rence ?", "O\u00f9 se situe le routeur ? Le switch ?", "Encapsulation = ?"], "validation": "Tu peux citer les 7 couches dans l'ordre."}, {"id": 9, "week": 2, "title": "Jour 9 \u2014 Encapsulation et trajet d'un paquet", "objective": "D\u00e9crire comment un message devient paquets, trames et bits.", "theory": {"label": "Professor Messer - Encapsulation / PDU", "url": "https://www.youtube.com/playlist?list=PLG49S3nxzAnnVhoAaL4B6aMFDQ8_gdxAy", "details": ["Encapsulation: Donn\u00e9e -> Segment (TCP) -> Paquet (IP) -> Trame (Ethernet) -> Bits", "PDU: Data, Segment, Packet, Frame, Bits", "D\u00e9sencapsulation \u00e0 l'arriv\u00e9e"]}, "practice": {"intro": "Visualise avec un curl.", "commands": ["curl -v https://example.com 2>&1 | head -20", "ping -c 4 8.8.8.8"], "exercice": "\u00c9cris le trajet: 'Je tape example.com -> DNS -> TCP handshake -> HTTP GET -> encapsulation -> ...' en 8 \u00e9tapes."}, "defi": "Dessine l'encapsulation d'une requ\u00eate HTTP: o\u00f9 est ajout\u00e9 le port ? L'IP ? L'adresse MAC ?", "notesPrompt": ["Paquet vs Trame vs Segment ?", "O\u00f9 se fait l'encapsulation ?", "LAN vs Internet ?"], "validation": "Tu sais expliquer le trajet d'une requ\u00eate web en couches."}, {"id": 10, "week": 2, "title": "Jour 10 \u2014 Adressage IPv4, MAC, masque", "objective": "Lire une adresse IP, un masque et une adresse MAC et comprendre leur r\u00f4le.", "theory": {"label": "Professor Messer - IPv4, Subnetting, MAC", "url": "https://www.youtube.com/playlist?list=PLG49S3nxzAnnVhoAaL4B6aMFDQ8_gdxAy", "details": ["IPv4: 32 bits, ex 192.168.1.10", "Masque /24 = 255.255.255.0 => 254 h\u00f4tes", "MAC: adresse physique de carte r\u00e9seau, ex aa:bb:cc:dd:ee:ff", "Passerelle = routeur qui sort du LAN"]}, "practice": {"intro": "Observe ton propre r\u00e9seau.", "commands": ["ip addr", "ip route", "ip neigh", "hostname -I"], "exercice": "Note: Ton IP priv\u00e9e, ta passerelle (default via...), ton masque. Est-ce du /24 ?"}, "defi": "Explique pourquoi 192.168.1.1 et 192.168.1.2 peuvent communiquer sans routeur mais pas 192.168.1.1 et 10.0.0.1.", "notesPrompt": ["IP priv\u00e9e vs publique ?", "Masque /24 = combien d'h\u00f4tes ?", "MAC = couche 2 ou 3 ?"], "validation": "Tu identifies IP, MAC, masque, passerelle sur ta machine."}, {"id": 11, "week": 2, "title": "Jour 11 \u2014 DNS, DHCP, IPv6, public/priv\u00e9", "objective": "Comprendre comment on obtient une IP et comment on r\u00e9sout un nom.", "theory": {"label": "Professor Messer - DNS, DHCP, IPv6", "url": "https://www.youtube.com/playlist?list=PLG49S3nxzAnnVhoAaL4B6aMFDQ8_gdxAy", "details": ["DHCP: donne IP automa /* ---------- stockage ---------- */
const store={
 get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let done=store.get("cyber30_done",{});
let notes=store.get("cyber30_notes",{});
let start=store.get("cyber30_start","");
let icsTime=store.get("cyber30_icsTime","09:00");
let view="today", sel=0;

function saveAll(){store.set("cyber30_done",done);store.set("cyber30_notes",notes);store.set("cyber30_start",start);}
function weekOf(id){const d=DATA.find(x=>x.id===id)||DATA[0];return WEEKS.find(w=>w.id===d.week)||WEEKS[0];}
function doneCount(){return Object.values(done).filter(Boolean).length;}
function pct(){return Math.round(doneCount()/30*100);}
function streak(){let s=0;for(let i=1;i<=30;i++){if(done[i])s++;else break;}return s;}
function todayIdx(){
 if(sel)return sel;
 if(start&&/^\d{4}-\d{2}-\d{2}$/.test(start)){
  const d=Math.floor((Date.now()-new Date(start+"T00:00:00").getTime())/86400000)+1;
  return Math.min(30,Math.max(1,d));
 }
 const nd=Object.keys(done).filter(k=>done[k]).map(Number);
 return Math.min(30,(nd.length?Math.max.apply(null,nd)+1:1));
}

/* ---------- actions ---------- */
function toggleDone(id){done[id]=!done[id];if(!done[id])delete done[id];saveAll();render();}
function go(v){view=v;sel=0;window.scrollTo(0,0);render();}
function pick(id){sel=id;view="today";window.scrollTo(0,0);render();}
function autoToday(){sel=0;render();}
function setStart(v){start=v;sel=0;saveAll();render();}
function setIcsTime(v){icsTime=v||"09:00";store.set("cyber30_icsTime",icsTime);}
function resetAll(){
 if(window.confirm("Réinitialiser toute la progression, les notes et la date de début ?")){
  done={};notes={};start="";localStorage.removeItem("cyber30_start");saveAll();render();
 }
}
function copyText(btn,text){
 const fb=document.createElement("textarea");fb.value=text;fb.style.position="fixed";fb.style.opacity="0";
 document.body.appendChild(fb);fb.select();
 let ok=false;
 try{ok=document.execCommand("copy")}catch(e){}
 document.body.removeChild(fb);
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){});ok=true;}
 if(btn){btn.textContent=ok?"✓ Copié":"Copier";btn.classList.add("ok");setTimeout(function(){btn.textContent="Copier";btn.classList.remove("ok")},1600);}
}
function saveNote(id,v){notes[id]=v;saveAll();}
function exportData(){
 const blob=new Blob([JSON.stringify({app:"cyber30j",version:1,done:done,notes:notes,start:start},null,1)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cyber30-sauvegarde.json";
 document.body.appendChild(a);a.click();document.body.removeChild(a);
 setTimeout(function(){URL.revokeObjectURL(a.href)},3000);
}
function importData(file){
 const r=new FileReader();
 r.onload=function(){
  try{
   const o=JSON.parse(r.result);
   if(o&&o.app==="cyber30j"){
    done=o.done||{};notes=o.notes||{};start=o.start||"";
    if(!start)localStorage.removeItem("cyber30_start");
    saveAll();render();
   }else{window.alert("Fichier de sauvegarde non reconnu (cyber30-sauvegarde.json attendu).");}
  }catch(e){window.alert("Fichier illisible : "+e.message);}
 };
 r.readAsText(file);
}

/* ---------- rappel calendrier (.ics) ---------- */
function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n");}
function pad(n){return String(n).padStart(2,"0");}
function downloadICS(){
 const base=(start&&/^\d{4}-\d{2}-\d{2}$/.test(start))?start:new Date().toISOString().slice(0,10);
 const d0=new Date(base+"T00:00:00");
 const hm=icsTime.split(":");
 const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cyber30J//Widget//FR","CALSCALE:GREGORIAN"];
 DATA.forEach(function(d){
  const dt=new Date(d0.getTime()+ (d.id-1)*86400000);
  const ds=dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate());
  const s=ds+"T"+pad(hm[0])+pad(hm[1])+"00";
  const eh=hm[1]==="55"?"00":pad(Number(hm[1])+5);
  const e=ds+"T"+pad(hm[0])+eh+"00";
  L.push("BEGIN:VEVENT","UID:cyber30-"+d.id+"-"+base+"@cyber30j","DTSTAMP:"+ds+"T000000",
   "DTSTART:"+s,"DTEND:"+e,
   "SUMMARY:"+icsEsc("Cyber30J · Jour "+d.id+" — "+d.title.replace(/^Jour\s*\d+\s*[—–-]\s*/,"")),
   "DESCRIPTION:"+icsEsc(d.objective),
   "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc("C'est l'heure du jour "+d.id+" !"),"TRIGGER:-PT10M","END:VALARM",
   "END:VEVENT");
 });
 L.push("END:VCALENDAR");
 const blob=new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cyber30-rappels.ics";
 document.body.appendChild(a);a.click();document.body.removeChild(a);
 setTimeout(function(){URL.revokeObjectURL(a.href)},3000);
}

/* ---------- notifications ---------- */
function notifSupported(){return "Notification" in window;}
function notifState(){return notifSupported()?Notification.permission:"unsupported";}
function askNotif(){
 if(!notifSupported())return;
 if(notifState()==="granted"){maybeNotify(true);render();return;}
 Notification.requestPermission().then(function(p){if(p==="granted")maybeNotify(true);render();}).catch(function(){render();});
}
function maybeNotify(force){
 if(!notifSupported()||Notification.permission!=="granted")return;
 const t=todayIdx();
 if(done[t])return;
 const todayKey=new Date().toISOString().slice(0,10);
 if(!force&&localStorage.getItem("cyber30_notif")===todayKey)return;
 localStorage.setItem("cyber30_notif",todayKey);
 const d=DATA[t-1];
 try{
  new Notification("🛡️ Cyber 30 Jours — Jour "+t,{
   body:d.title+" — "+d.objective, tag:"cyber30", icon:"icon-192.png", badge:"icon-192.png"
  });
 }catch(e){}
}

 p2.textContent="🔔 Rappels : "+(notifState()==="granted"
  ?"activés — une notification s'affiche à l'ouverture de l'app quand le jour n'est pas fait."
  :(notifState()==="denied"
   ?"bloqués — réactive-les dans les réglages du site dans Chrome."
    :"désactivés — active-les pour être alerté à l'ouverture."));
 const nb=add(p2,"button","mini"+(notifState()==="granted"?" on":" acc"),
  notifState()==="granted"?"🔔 Rappels activés ✓":"🔔 Activer les rappels");
 nb.addEventListener("click",askNotif);

 const l2=add(foot,"label","inline","📅 Rappel calendrier");
 const ti=el("input");ti.type="time";ti.value=icsTime;
 ti.addEventListener("change",function(){setIcsTime(ti.value)});
 l2.appendChild(ti);
 const ib=add(l2,"button","mini acc","Télécharger le .ics (30 rappels)");
 ib.addEventListener("click",downloadICS);

 const p3=add(foot,"p","mut","Pour de vraies notifications quotidiennes programmées, Android exige un serveur de push : le plus fiable hors ligne reste le rappel calendrier .ics ci-dessus (alarme + notification système à l'heure choisie).");

 const row=add(foot,"div","btnrow");
 const eb=add(row,"button","mini","💾 Exporter la sauvegarde");eb.addEventListener("click",exportData);
 const imp=add(row,"button","mini","📂 Importer");imp.addEventListener("click",function(){document.getElementById("importFile").click()});
 const rb=add(row,"button","mini danger","Réinitialiser");rb.addEventListener("click",resetAll);
 return wrap;
}

function parcoursView(){
 const wrap=el("section","card");
 add(wrap,"h3",null,"Parcours complet — 30 jours");
 WEEKS.forEach(function(w){
  const days=DATA.filter(function(d){return d.week===w.id});
  const dn=days.filter(function(d){return done[d.id]}).length;
  const wk=add(wrap,"div","wk");
  const hd=add(wk,"div","wkhead");
  const tt=add(hd,"span",null,w.title+" · "+w.topic);tt.style.color=w.color;
  add(hd,"span","rng",w.range+" · "+dn+"/"+w.count);
  const bar=add(wk,"div","bar sm");const f=add(bar,"div","fill");
  f.style.width=(dn/w.count*100)+"%";f.style.background=w.color;
  days.forEach(function(d){
   const r=add(wk,"button","row"+(done[d.id]?" did":""));
   const num=add(r,"span","num",String(d.id));num.style.borderColor=w.color;
   add(r,"span","rt",d.title);
   if(done[d.id])add(r,"span","ok","✓");
   r.addEventListener("click",function(){pick(d.id)});
  });
 });
 return wrap;
}

function semainesView(){
 const t=todayIdx();
 const frag=document.createDocumentFragment();
 WEEKS.forEach(function(w){
  const days=DATA.filter(function(d){return d.week===w.id});
  const dn=days.filter(function(d){return done[d.id]}).length;
  const cur=days.some(function(d){return d.id===t});
  const c=add(frag,"section","card wkcard"+(cur?" cur":""));
  const hd=add(c,"div","wkhead");
  const tt=add(hd,"span",null,w.title);tt.style.color=w.color;
  if(cur)add(hd,"span","badge","en cours").style.cssText="background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.4)";
  add(c,"p","mut",w.range+" · "+w.topic+" — "+w.desc);
  const bar=add(c,"div","bar");const f=add(bar,"div","fill");
  f.style.width=(dn/w.count*100)+"%";f.style.background=w.color;
  add(c,"p","mut",dn+"/"+w.count+" jours validés").style.marginBottom="9px";
  const b=add(c,"button","mini","Voir les jours");
  b.addEventListener("click",function(){go("parcours")});
 });
 return frag;
}

/* ---------- rendu ---------- */
function render(){
 const app=document.getElementById("app");
 app.textContent="";
 const n=doneCount(), t=todayIdx(), st=streak();

 const header=el("header");
 const brand=add(header,"div","brand");
 const l=add(brand,"span","l");
 l.innerHTML=SHIELD;
 l.appendChild(document.createTextNode("Cyber 30 Jours"));
 add(brand,"span","r",n+"/30 · "+pct()+"%"+(st>1?" · 🔥"+st:""));
 const bar=add(header,"div","bar");add(bar,"div","fill").style.width=pct()+"%";
 const nav=add(header,"nav");
 [["today","Aujourd'hui"],["parcours","Parcours"],["semaines","Semaines"]].forEach(function(x){
  const b=add(nav,"button",view===x[0]?"on":"",x[1]);
  b.addEventListener("click",function(){go(x[0])});
 });
 app.appendChild(header);

 const main=el("main");
 if(view==="today")main.appendChild(todayView(t));
 else if(view==="parcours")main.appendChild(parcoursView());
 else main.appendChild(semainesView());
 app.appendChild(main);
}

document.getElementById("importFile").addEventListener("change",function(e){
 if(e.target.files&&e.target.files[0])importData(e.target.files[0]);
 e.target.value="";
});
render();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}
if("Notification" in window&&Notification.permission==="granted"){setTimeout(maybeNotify,1500)}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")maybeNotify()});
</script>
